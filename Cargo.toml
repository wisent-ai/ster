[package]
name = "ster"
version = "0.13.0"
edition = "2024"
rust-version = "1.85"
description = "Representation reading and steering for open-weight language models"
license = "MIT"
publish = false
repository = "https://github.com/wisent-ai/ster"
homepage = "https://ster.wisent.com"
readme = "README.md"
keywords = ["llm", "representation-engineering", "activation-steering", "machine-learning"]
categories = ["command-line-utilities", "science"]
exclude = ["assets/*", ".github/*", "release/*"]

[[bin]]
name = "ster"
path = "src/main.rs"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow = "1.0.100"
blake2 = "0.10"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
clap = { version = "4.5.53", features = ["derive"] }
hf-hub = "0.4.3"
minijinja = { version = "2.24", features = ["json", "loop_controls"] }
rand = "0.9.2"
regex = "1.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokenizers = "0.22.1"
unicode-normalization = "0.1"
ureq = "2.12"
