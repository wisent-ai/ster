schemaVersion: 1
appId: ster
productId: ster
owner: Ster maintainers
repositories:
  - repository: ster
    mappings:
      - paths:
          - src/cli/onboarding/**
          - src/workspace/**
          - src/artifact/**
          - Cargo.toml
          - .probierz/ster/journeys/onboarding-first-use.mjs
        journeys: [onboarding-first-use]
      - paths:
          - src/workspace/**
          - .probierz/ster/journeys/desktop-first-use.mjs
        journeys: [desktop-first-use]
  - repository: ster-desktop
    mappings:
      - paths:
          - Sources/SterDesktop/Onboarding/**
          - Sources/SterDesktop/Resources/ster-desktop-first-use.json
          - Sources/SterDesktop/App/Import/**
          - Package.swift
        journeys: [desktop-first-use]
  - repository: wisent-desktop-update
    mappings:
      - paths: ["Sources/**", Package.swift, Package.resolved]
        journeys: [desktop-first-use]
  - repository: wisent-errors
    mappings:
      - paths: ["catalogue/**", "codegen/**", "schema/**", "rust/**", "swift/**", "js/**", Cargo.toml, Package.swift, package.json]
        journeys: [desktop-first-use, onboarding-first-use]
  - repository: wisent-formats
    mappings:
      - paths: ["rust/**", "swift/**", "js/**", "wasm/**", "capi/**", Cargo.toml, Package.swift, package.json]
        journeys: [desktop-first-use, onboarding-first-use]
surfaces:
  tui:
    spec: journeys/
    journeys: [onboarding-first-use]
    conditions:
      TUI_CMD: "{workspace}/ster/target/release/ster"
  desktop:cua:
    spec: journeys/
    journeys: [desktop-first-use]
    conditions:
      CUA_APP_EXECUTABLE: ~/Applications/Ster.app/Contents/MacOS/SterDesktop
      WISENT_WORKSPACE: "{workspace}"
journeys:
  desktop-first-use:
    owner: Ster maintainers
    description: With its onboarding cleared from the app's defaults and restored afterwards, and a workspace of its own, Ster Desktop's three-screen walkthrough refuses a malformed pair set chosen in the open panel without finishing, and finishes only when a real pair set is imported and made active.
    value: A researcher brings their own contrastive data into the desktop app, validated before anything is written.
    journeyId: first-use
    journeyVersion: 2026-09-05.1
    journeyVersionId: 1d6f9b3a-5e27-4c84-b0a6-8c2e4f7d1b95
    firstSuccessFact: contrastive_pair_set_imported
    publication:
      screenId: first_success
      artifactKinds: [screenshot]
      minimumEvidence: E3
      redactionRequired: false
  onboarding-first-use:
    owner: Ster maintainers
    description: With state and a workspace of its own, the walkthrough shows its three screens and names `ster onboarding --import-pairs` without completing; a malformed pair set is rejected and completes nothing; importing a real set copies it into the workspace with its pair count and makes it active, which alone completes first use; the same set is unchanged and a different set under the same name is a conflict that keeps the first.
    value: A researcher starts Ster from contrastive data they already own, without loading a model, and existing work is never replaced.
    journeyId: first-use
    journeyVersion: 2026-09-05.1
    journeyVersionId: 9c2b4e71-6d08-4a3f-8e5c-0b7d1f3a6e29
    firstSuccessFact: contrastive_pair_set_imported
    publication:
      screenId: import_pairs
      artifactKinds: [trace]
      minimumEvidence: E2
      redactionRequired: false
artifacts:
  retain:
    pullRequestDays: 14
    nightlyDays: 30
    adhocDays: 7
  redact: [TOKEN, SECRET, PASSWORD, KEY, COOKIE, AUTH]
  pii: unlikely
pullRequestPolicy:
  minimumEvidence: E2
  requiredTargets: [tui]
  requiredJourneys: [onboarding-first-use]
releasePolicy:
  minimumEvidence: E2
  requiredTargets: [tui]
  requiredJourneys: [onboarding-first-use]
  requireProtectedArtifacts: false
  requireSecretScan: true
